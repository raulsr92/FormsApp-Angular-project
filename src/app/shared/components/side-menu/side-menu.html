
<h2>Páginas</h2>
<hr>

<h3 class="mt-3">Reactive</h3>
<ul class="list-group">
  @for (ruta of reactiveMenu; track ruta.title) {
    <li
      class="list-group-item"
      [routerLink]="ruta.route"
      routerLinkActive="active">
        {{ruta.title}}
    </li>
  }
</ul>

<hr>
